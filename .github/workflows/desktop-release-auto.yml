name: Publish Desktop Release · Automatic

on:
  workflow_run:
    workflows: ['Package Desktop · GitHub Cloud']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      build_run_id:
        description: 'Existing successful cloud packaging run ID to upload and publish'
        type: string
        required: true

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    uses: ./.github/workflows/desktop-release-from-build.yml
    with:
      build_run_id: ${{ github.event_name == 'workflow_dispatch' && inputs.build_run_id || format('{0}', github.event.workflow_run.id) }}
      publish_release: true
